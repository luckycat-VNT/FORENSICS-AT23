          "mac.mount.Mount: Liệt kê các điểm mount hệ thống file.",
          "mac.psaux.Psaux: Khôi phục đối số dòng lệnh của chương trình.",
          "mac.pslist.PsList: Liệt kê tiến trình đang chạy.",
          "mac.pstree.PsTree: Hiển thị tiến trình dạng cây.",
          "mac.ifconfig.Ifconfig: Liệt kê thông tin các card mạng.",
          "mac.netstat.Netstat: Liệt kê kết nối mạng.",
          "mac.check_syscall.Check_syscall: Kiểm tra bảng Syscall có bị hook không.",
          "mac.check_sysctl.Check_sysctl: Kiểm tra bộ xử lý sysctl.",
          "mac.check_trap_table.Check_trap_table: Kiểm tra bảng Mach trap.",
          "mac.kauth_listeners.Kauth_listeners: Liệt kê các Kauth Listener.",
          "mac.kauth_scopes.Kauth_scopes: Liệt kê các Kauth Scope.",
          "mac.kevents.Kevents: Liệt kê các event handler đăng ký bởi tiến trình.",
          "mac.malfind.Malfind: Tìm vùng nhớ bị tiêm mã độc trên macOS.",
          "mac.proc_maps.Maps: Liệt kê các bản đồ vùng nhớ tiến trình.",
          "mac.socket_filters.Socket_filters: Liệt kê bộ lọc socket trong kernel.",
          "mac.timers.Timers: Kiểm tra kernel timer độc hại.",
          "mac.trustedbsd.Trustedbsd: Kiểm tra các mô-đun TrustedBSD bất thường.",
          "mac.vfsevents.VFSevents: Liệt kê tiến trình đang lọc sự kiện VFS file system."
        ]
      }
    ];

    // Render Preview HTML
    const previewContainer = document.getElementById('previewArea');
    fullData.slice(1).forEach(sec => {
      const h2 = document.createElement('h2');
      h2.textContent = sec.heading;
      previewContainer.appendChild(h2);

      const ul = document.createElement('ul');
      sec.items.forEach(item => {
        const li = document.createElement('li');
        const parts = item.split(': ');
        if (parts.length > 1) {
          li.innerHTML = `<code>${parts[0]}</code>: ${parts.slice(1).join(': ')}`;
        } else {
          li.textContent = item;
        }
        ul.appendChild(li);
      });
      previewContainer.appendChild(ul);
    });

    // DOCX Export Logic
    document.getElementById('downloadBtn').addEventListener('click', function () {
      const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
      const children = [];

      // Title
      children.push(
        new Paragraph({
          children: [
            new TextRun({
              text: fullData[0].title,
              bold: true,
              size: 32,
              color: "003366",
            }),
          ],
          spacing: { after: 120 },
        }),
        new Paragraph({
          children: [
            new TextRun({
              text: fullData[0].subtitle,
              italics: true,
              size: 22,
              color: "555555",
            }),
          ],
          spacing: { after: 360 },
        })
      );

      // Sections
      for (let i = 1; i < fullData.length; i++) {
        const sec = fullData[i];
        children.push(
          new Paragraph({
            text: sec.heading,
            heading: HeadingLevel.HEADING_2,
            spacing: { before: 240, after: 120 },
          })
        );

        sec.items.forEach(item => {
          const parts = item.split(': ');
          if (parts.length > 1) {
            children.push(
              new Paragraph({
                children: [
                  new TextRun({
                    text: parts[0] + ": ",
                    bold: true,
                    color: "0055A5",
                  }),
                  new TextRun({
                    text: parts.slice(1).join(': '),
                  }),
                ],
                bullet: { level: 0 },
                spacing: { after: 60 },
              })
            );
          } else {
            children.push(
              new Paragraph({
                text: item,
                bullet: { level: 0 },
                spacing: { after: 60 },
              })
            );
          }
        });
      }

      const doc = new Document({
        sections: [
          {
            properties: {},
            children: children,
          },
        ],
      });

      Packer.toBlob(doc).then((blob) => {
        saveAs(blob, "Volatility3_DayDu_Vol3.docx");
      });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', function (e) {
      const filter = e.target.value.toLowerCase();
      const items = document.querySelectorAll('#previewArea li');
      items.forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(filter) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
